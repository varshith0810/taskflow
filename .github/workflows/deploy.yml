name: CI/CD Pipeline — TaskFlow AWS Production

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  # ── Step 1: Run Backend Tests ─────────────────────────────────────────────
  test:
    name: Run Backend Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest httpx

      - name: Run Backend Tests
        run: |
          pytest backend/tests -v

  # ── Step 2: Build & Push Docker Image to GHCR ────────────────────────────
  build-and-push:
    name: Build & Push Docker Image
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Step 3: Deploy to AWS EC2 via SSH ────────────────────────────────────
  deploy:
    name: Deploy to AWS EC2
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.AWS_HOST }}
          username: ${{ secrets.AWS_SSH_USER }}
          key: ${{ secrets.AWS_SSH_PRIVATE_KEY }}
          port: ${{ secrets.AWS_SSH_PORT || 22 }}
          script: |
            set -e
            mkdir -p ~/taskflow && cd ~/taskflow

            echo "[1/5] Authenticating with GHCR..."
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io \
              -u ${{ github.actor }} --password-stdin

            echo "[2/5] Writing docker-compose.yml (RDS-backed, no local DB container)..."
            cat > docker-compose.yml << 'COMPOSE'
            services:
              taskflow:
                image: ghcr.io/${{ github.repository }}:latest
                container_name: taskflow-app
                restart: always
                ports:
                  - "80:8000"
                environment:
                  - PORT=8000
                  - HOST=0.0.0.0
                  - ENVIRONMENT=production
                  - DEBUG=false
                  - SECRET_KEY=${{ secrets.SECRET_KEY }}
                  - DATABASE_URL=${{ secrets.DATABASE_URL }}
                  - ALLOWED_ORIGINS=*
                healthcheck:
                  test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
                  interval: 30s
                  timeout: 10s
                  retries: 3
                  start_period: 40s
                logging:
                  driver: "json-file"
                  options:
                    max-size: "10m"
                    max-file: "3"

              monitoring:
                image: louislam/uptime-kuma:1
                container_name: taskflow-monitor
                restart: always
                ports:
                  - "3001:3001"
                volumes:
                  - uptime-kuma-data:/app/data
                logging:
                  driver: "json-file"
                  options:
                    max-size: "5m"
                    max-file: "2"

            volumes:
              uptime-kuma-data:
            COMPOSE

            echo "[3/5] Pulling latest container image..."
            docker compose pull taskflow

            echo "[4/5] Deploying TaskFlow + Uptime Kuma..."
            docker compose up -d --remove-orphans

            # Clean up old images to save disk space
            docker image prune -f

            echo "[5/5] Verifying application health..."
            sleep 15
            for i in {1..5}; do
              if curl -sf http://127.0.0.1/health; then
                echo ""
                echo "✅ Deployment successful! TaskFlow is live."
                exit 0
              fi
              echo "Health check attempt $i/5 — waiting 10s..."
              sleep 10
            done

            echo "❌ Health check failed after 5 attempts — dumping logs for debugging"
            docker logs --tail 100 taskflow-app
            exit 1
