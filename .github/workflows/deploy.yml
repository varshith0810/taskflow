name: CI/CD Pipeline - AWS Low-Cost Deployment

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  # ── Step 1: Run Automated Tests ──────────────────────────────────────────
  test:
    name: Run Automated Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest httpx

      - name: Run Backend Tests
        run: |
          pytest backend/tests

  # ── Step 2: Build & Push Container Image to GHCR ────────────────────────
  build-and-push:
    name: Build & Push Docker Image
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Step 3: Deploy to AWS via SSH ───────────────────────────────────────
  deploy:
    name: Deploy to AWS
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Deploy on AWS Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.AWS_HOST }}
          username: ${{ secrets.AWS_SSH_USER || 'ubuntu' }}
          key: ${{ secrets.AWS_SSH_PRIVATE_KEY }}
          port: 22
          script: |
            mkdir -p ~/taskflow
            cd ~/taskflow

            echo "[*] Authenticating with GHCR..."
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            echo "[*] Writing docker-compose.yml configuration..."
            cat << 'EOF' > docker-compose.yml
            services:
              db:
                image: postgres:16-alpine
                container_name: taskflow-postgres
                restart: always
                environment:
                  POSTGRES_USER: taskflow_admin
                  POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD || 'taskflow_secure_prod_password_2026' }}
                  POSTGRES_DB: taskflow_db
                volumes:
                  - postgres-data:/var/lib/postgresql/data
                healthcheck:
                  test: ["CMD-SHELL", "pg_isready -U taskflow_admin -d taskflow_db"]
                  interval: 5s
                  timeout: 5s
                  retries: 5

              taskflow:
                image: ghcr.io/${{ github.repository }}:latest
                container_name: taskflow-app
                restart: always
                ports:
                  - "80:8000"
                environment:
                  - PORT=8000
                  - HOST=0.0.0.0
                  - ENVIRONMENT=production
                  - DEBUG=false
                  - SECRET_KEY=${{ secrets.SECRET_KEY || 'prod-secure-taskflow-secret-key-32bytes-long' }}
                  - DATABASE_URL=postgresql://taskflow_admin:${{ secrets.POSTGRES_PASSWORD || 'taskflow_secure_prod_password_2026' }}@db:5432/taskflow_db
                  - ALLOWED_ORIGINS=*
                depends_on:
                  db:
                    condition: service_healthy

              monitoring:
                image: louislam/uptime-kuma:1
                container_name: taskflow-monitor
                restart: always
                ports:
                  - "3001:3001"
                volumes:
                  - uptime-kuma-data:/app/data

            volumes:
              postgres-data:
              uptime-kuma-data:
            EOF

            echo "[*] Pulling latest container images..."
            docker compose pull taskflow

            echo "[*] Deploying TaskFlow, PostgreSQL Database, and Monitoring..."
            docker compose up -d --remove-orphans

            echo "[*] Verifying deployment health..."
            sleep 8
            curl -f http://127.0.0.1/health || docker logs --tail 50 taskflow-app
