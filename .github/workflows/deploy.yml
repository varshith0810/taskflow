name: CI/CD Pipeline - AWS Low-Cost Deployment

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  # ── Step 1: Run Automated Tests ──────────────────────────────────────────
  test:
    name: Run Automated Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest httpx

      - name: Run Backend Tests
        run: |
          pytest backend/tests

  # ── Step 2: Build & Push Container Image to GHCR ────────────────────────
  build-and-push:
    name: Build & Push Docker Image
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Step 3: Deploy to AWS via SSH ───────────────────────────────────────
  deploy:
    name: Deploy to AWS
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Deploy on AWS Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.AWS_HOST }}
          username: ${{ secrets.AWS_SSH_USER || 'ubuntu' }}
          key: ${{ secrets.AWS_SSH_PRIVATE_KEY }}
          port: 22
          script: |
            echo "[*] Pulling latest Docker image from GHCR..."
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker pull ghcr.io/${{ github.repository }}:latest

            echo "[*] Stopping previous container if running..."
            docker stop taskflow-app || true
            docker rm taskflow-app || true

            echo "[*] Launching new TaskFlow container..."
            docker volume create taskflow-data || true

            docker run -d \
              --name taskflow-app \
              --restart always \
              -p 80:8000 \
              -v taskflow-data:/app/data \
              -e PORT=8000 \
              -e HOST=0.0.0.0 \
              -e ENVIRONMENT=production \
              -e DEBUG=false \
              -e SECRET_KEY="${{ secrets.SECRET_KEY || 'default-production-secret-key-32-chars-long' }}" \
              -e DATABASE_URL="sqlite:////app/data/task_manager.db" \
              -e ALLOWED_ORIGINS="*" \
              ghcr.io/${{ github.repository }}:latest

            echo "[*] Verifying container health..."
            sleep 5
            curl -f http://127.0.0.1/health || docker logs --tail 50 taskflow-app
